# Installed on smith-app/gh-pages by deploy-pages.sh; edit this source template.
name: Deploy Smithkit demo to Pages

on:
  push:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy the tested site
        id: deployment
        uses: actions/deploy-pages@v5
