name: Check and publish Smith chart

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smith-chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: smith-app-site
          path: dist/demo/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: check
    if: >-
      github.repository == 'rosek86/smith-chart' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.SMITH_APP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: smith-app-pages
      cancel-in-progress: false
    environment:
      name: smith-app-pages
      url: https://rosek86.github.io/smith-app/
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: smith-app-site
          path: site
      - name: Check deployment credential
        env:
          DEPLOY_KEY: ${{ secrets.SMITH_APP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo '::error::Add the SMITH_APP_DEPLOY_KEY secret described in docs/deployment.md.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          repository: rosek86/smith-app
          path: publish
          ssh-key: ${{ secrets.SMITH_APP_DEPLOY_KEY }}
      - name: Publish tested build to smith-app/gh-pages
        run: bash source/scripts/deploy-pages.sh site publish
