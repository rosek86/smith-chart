name: Publish smithkit to npm

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'rosek86/smithkit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const p = JSON.parse(fs.readFileSync('package.json')); assert.equal(process.env.RELEASE_TAG, 'v' + p.version); assert.match(p.version, /^\d+\.\d+\.\d+$/);"
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run prepare:release
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: artifacts/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package
      - name: Check whether this exact archive is already published
        id: registry
        run: node scripts/release-status.mjs package
      - name: Publish the verified archive with npm trusted publishing
        if: steps.registry.outputs.published != 'true'
        env:
          NPM_ARCHIVE: ${{ steps.registry.outputs.archive }}
        run: npm publish "package/$NPM_ARCHIVE" --access public --provenance --ignore-scripts
